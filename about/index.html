<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伊万里支部について - 日本将棋連盟 伊万里支部</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<header id="common-header"></header>

<div class="container">
    <section>
        <h2>伊万里支部について</h2>
        <p>日本将棋連盟 伊万里支部は、磁器の里・秘窯の里として知られる佐賀県伊万里市を拠点に活動しています。<br>
           将棋文化の普及と地方棋界の発展、そして世代を超えた交流を目的として活動するアマチュア将棋団体です。</p>
        
        <table class="info-table">
            <tr>
                <th>支部名</th>
                <td>日本将棋連盟 伊万里支部</td>
            </tr>
            <tr>
                <th>支部長</th>
                <td>〇〇 〇〇</td>
            </tr>
            <tr>
                <th>会員数</th>
                <td>〇〇名（2025年12月現在）</td>
            </tr>
            <tr>
                <th>お問い合わせ</th>
                <td>入会希望やご質問などは<a href="../contact/">お問い合わせ</a>よりお気軽にご連絡ください。</td>
            </tr>
        </table>
    </section>

    <section>
        <h2>主な活動内容</h2>
        <p>伊万里支部では、初心者から有段者まで楽しめる以下の活動を行っています。</p>
        <ul>
            <li><strong>例会（月1回）</strong></li>
            <li><strong>将棋大会の主催（年3回）</strong></li>
            <li><strong>伊万里こども将棋教室（月2回）</strong></li>
        </ul>
    </section>
</div>

<footer id="common-footer"></footer>

<script>
    function loadComponent(id, file) {
        fetch(file)
            .then(response => {
                if (!response.ok) throw new Error(file + 'が見つかりません');
                return response.text();
            })
            .then(data => {
                document.getElementById(id).innerHTML = data;
            })
            .catch(error => console.error(error));
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadComponent('common-header', '/header.html');
        loadComponent('common-footer', '/footer.html');
    });
</script>

</body>
</html>
