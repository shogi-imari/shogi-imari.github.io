<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本将棋連盟 伊万里支部</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="common-header"></header>

<div class="container">
    <section class="main-visual">
        <div class="photo-frame">
            <p>【ここに将棋を指している写真を表示】</p>
        </div>
    </section>

    <section id="top-intro">
        <h2>伊万里支部について</h2>
        <p>日本将棋連盟 伊万里支部は、佐賀県伊万里市を拠点に活動する将棋のアマチュア団体です。<br>
            初心者から有段者まで、幅広い世代が将棋を通じて交流を深めています。入会は随時受け付けております。</p>
        <div style="margin-top: 15px;">
            <a href="/about/index.html" class="more-link">＞ 支部の詳細・活動はこちら</a>
        </div>
    </section>

    <section>
        <h2>お知らせ</h2>
        <ul id="top-news-container" class="news-list">
        </ul>
        <div style="margin-top: 15px;">
            <a href="/news/index.html" class="more-link">＞ 過去のお知らせ一覧はこちら</a>
        </div>
    </section>
</div>

<footer id="common-footer"></footer>

<script src="/js/common.js"></script>
<script src="/js/news-manager.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const allNews = await NewsManager.fetchAll();
            NewsManager.render(allNews, 'top-news-container', 0, 5);
        } catch (error) {
            console.error("ニュースの読み込みに失敗しました:", error);
        }
    });
</script>

</body>
</html>
