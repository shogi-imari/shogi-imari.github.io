<!DOCTYPE html>
<html lang="ja">
<head>

    <link rel="stylesheet" href="../style.css">
</head>
<body>

<header id="common-header"></header>

<div class="container">
    <section>
        <h2>例会案内</h2>

    <section>

        <div id="archive-container" class="archive-container">
            <details class="archive-year">
                <summary>2026年</summary>
                <ul>
                    <li><a href="viewer.html?date=202601">1月</a></li>
                </ul>
            </details>
        </div>
    </section>
</div>

<footer id="common-footer"></footer>

<script src="/js/common.js"></script>
<script src="/js/info-manager.js"></script>

<script>
    // 既存のloadComponentはcommon.jsに含まれるため削除
    // loadReikaiInfoの代わりにInfoManagerを使用
    document.addEventListener('DOMContentLoaded', () => {
        InfoManager.loadAndRender('info.json', 'reikai-info-container');
    });
</script>
