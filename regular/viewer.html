<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>例会結果 - 日本将棋連盟 伊万里支部</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .league-table {
            width: auto;
            min-width: 600px;
            border-collapse: collapse;
            margin: 20px 0;
            border: 2px solid #333;
        }
        .league-table th, .league-table td {
            border: 1px solid #333;
            padding: 8px;
        }
        .league-table thead th {
            background-color: #f1f0e9;
        }
        .col-num {
            text-align: right;
            padding-right: 10px;
            width: 40px;
            color: #666;
            font-size: 0.9rem;
            background-color: #f9f9f9;
        }
        .col-name {
            text-align: left;
            padding-left: 10px;
            min-width: 150px;
            font-weight: bold;
        }
        .league-table td {
            text-align: center;
            width: 45px;
            height: 45px;
        }
        .col-score, .col-rank {
            background-color: #fdfdfd;
            font-weight: bold;
            min-width: 60px;
        }
        .cell-self {
            background-color: #ddd;
        }
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>

<header id="common-header"></header>

<div class="container">
    <section>
        <h2 id="eventTitle">読み込み中...</h2>
        
        <table class="info-table">
            <tbody id="info-table-body">
                <tr><th>日付</th><td id="eventDate">-</td></tr>
                <tr><th>場所</th><td id="eventLocation">-</td></tr>
            </tbody>
        </table>

        <h3>結果</h3>
        <div class="table-scroll" id="tableContainer"></div>

        <h3>コメント</h3>
        <div id="eventComment" style="white-space: pre-wrap; background: #f9f9f9; padding: 15px; border-radius: 4px; min-height: 50px;"></div>
    </section>
    
    <p><a href="./index.html">« 例会案内へ戻る</a></p>
</div>

<footer id="common-footer"></footer>

<script src="/js/common.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const dateParam = urlParams.get('date');

    function getJsonPath(param) {
        if (!param || param.length !== 6) return 'info.json';
        const year = param.substring(0, 4);
        const monthNum = parseInt(param.substring(4, 6), 10);
        return `result/${year}/${monthNum}.json`;
    }

    const jsonPath = getJsonPath(dateParam);

    fetch(jsonPath)
        .then(response => {
            if (!response.ok) throw new Error('ファイルが見つかりません');
            return response.json();
        })
        .then(rawData => {
            // 配列の1番目を取得
            const data = Array.isArray(rawData) ? rawData[0] : rawData;

            // タイトルの設定
            if (dateParam) {
                const y = dateParam.substring(0, 4);
                const m = parseInt(dateParam.substring(4, 6), 10);
                document.getElementById('eventTitle').textContent = `${y}年${m}月 例会結果`;
            } else {
                document.getElementById('eventTitle').textContent = "最新の例会結果";
            }

            // --- 案内情報の反映 (JSON構成変更に対応) ---
            document.getElementById('eventDate').textContent = data.info.date;
            document.getElementById('eventLocation').textContent = data.info.location;
            
            // detail内の項目（ルールや会費など）を動的に追加
            const infoBody = document.getElementById('info-table-body');
            if (data.info.detail) {
                Object.entries(data.info.detail).forEach(([key, value]) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `<th>${key}</th><td>${value}</td>`;
                    infoBody.appendChild(row);
                });
            }

            // --- 結果情報の反映 (data.result へのパス変更に対応) ---
            document.getElementById('eventComment').innerHTML = data.result.comment;

            const participants = data.result.participants;
            const league = data.result.league;
            const pCount = participants.length;

            if (pCount === 0) {
                document.getElementById('tableContainer').innerHTML = "<p>結果データはまだ登録されていません。</p>";
                return;
            }
            
            // 星取表の生成ロジック
            let tableHtml = '<table class="league-table"><thead><tr><th colspan="2">選手名</th>';
            participants.forEach((_, index) => {
                tableHtml += `<th>${index + 1}</th>`;
            });
            tableHtml += '<th>勝敗</th><th>順位</th></tr></thead><tbody>';

            participants.forEach((p, i) => {
                tableHtml += `<tr>`;
                tableHtml += `<td class="col-num">${i + 1}</td>`;
                tableHtml += `<td class="col-name">${p}</td>`;
                
                for (let j = 0; j < pCount; j++) {
                    if (i === j) {
                        tableHtml += `<td class="cell-self">-</td>`;
                    } else {
                        const res = league[i][j] || '-';
                        tableHtml += `<td>${res}</td>`;
                    }
                }

                // スコアと順位（リーグデータの最後2つ）
                tableHtml += `<td class="col-score">${league[i][pCount] || '-'}</td>`;
                tableHtml += `<td class="col-rank">${league[i][pCount + 1] || '-'}</td>`;
                tableHtml += `</tr>`;
            });
            tableHtml += '</tbody></table>';

            document.getElementById('tableContainer').innerHTML = tableHtml;
        })
        .catch(error => {
            console.error(error);
            document.getElementById('eventTitle').textContent = "データなし";
            document.getElementById('tableContainer').innerHTML = `<p>指定されたデータが見つかりませんでした</p>`;
        });
</script>

</body>
</html>
