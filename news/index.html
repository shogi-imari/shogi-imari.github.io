<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お知らせ - 日本将棋連盟 伊万里支部</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<header id="common-header"></header>

<div class="container">
    <section>
        <h2>お知らせ</h2>
        <ul id="news-container" class="news-page-list"></ul>
        <div id="pagination" class="pagination"></div>
    </section>
</div>

<footer id="common-footer"></footer>

<script src="/js/common.js"></script>
<script src="/js/news-manager.js"></script>

<script>
    let allNewsData = [];
    const itemsPerPage = 20;

    async function showPage(page) {
        // 1. ニュースリストの描画
        const start = (page - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        NewsManager.render(allNewsData, 'news-container', start, end);
        
        // 2. ページネーションの描画（クリック時にshowPageを再実行）
        NewsManager.renderPagination('pagination', allNewsData.length, itemsPerPage, page, 'showPage');
        
        window.scrollTo(0, 0);
    }

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            // データの取得
            allNewsData = await NewsManager.fetchAll();
            // 1ページ目を表示
            showPage(1);
        } catch (error) {
            console.error("ニュースの読み込みに失敗しました:", error);
        }
    });

    // 画面サイズ変更時の再調整
    window.addEventListener('resize', () => {
        const activeBtn = document.querySelector('.pagination button.active');
        if (activeBtn) {
            showPage(parseInt(activeBtn.innerText));
        }
    });
</script>
</body>
</html>
